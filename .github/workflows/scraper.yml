name: Estrai email dai siti

# Si avvia a mano dalla scheda "Actions" del repo (pulsante "Run workflow").
on:
  workflow_dispatch:
    inputs:
      file_input:
        description: "Nome del file CSV con i siti (caricato nel repo)"
        required: true
        default: "siti.csv"
      potenza:
        description: "Potenza dello scraper"
        required: true
        type: choice
        default: "massima"
        options:
          - "massima"   # statico + render JavaScript + OCR immagini (piu' email, piu' lento)
          - "base"      # solo download statico (piu' veloce)
      concurrency:
        description: "Siti in parallelo (piu' alto = piu' veloce)"
        required: true
        default: "30"
      max_pages:
        description: "Pagine massime per sito (home + contatti)"
        required: true
        default: "8"
      timeout:
        description: "Timeout per pagina in secondi"
        required: true
        default: "15"

permissions:
  contents: write   # serve per pubblicare progresso e risultati sul branch "risultati"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"   # mostra l'avanzamento in tempo reale nel log

    steps:
      - name: Scarica il codice del repo
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze Python
        run: pip install -r requirements.txt

      - name: Installa il browser per il render JavaScript
        if: ${{ inputs.potenza == 'massima' }}
        run: python -m playwright install --with-deps chromium

      - name: Installa Tesseract per l'OCR (lettura email dalle immagini)
        if: ${{ inputs.potenza == 'massima' }}
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ita

      - name: Controlla che il file dei siti esista
        run: |
          if [ ! -f "${{ inputs.file_input }}" ]; then
            echo "::error::Il file '${{ inputs.file_input }}' non esiste nel repo. Caricalo prima (Add file -> Upload files) e riprova."
            exit 1
          fi
          echo "Trovato il file: ${{ inputs.file_input }}"

      - name: Prepara il branch "risultati" (per la dashboard)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB"
          cd "$PUB"
          git init -q
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan risultati
          echo '{"running":true,"finished":false,"total":0,"done":0,"with_email":0,"emails":0}' > progress.json
          printf 'sito,email,stato\n' > emails.csv
          git add -A
          git commit -q -m "avvio"
          git push -q -f origin risultati

      - name: Esegui lo scraper (con pubblicazione live del progresso)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUB="$RUNNER_TEMP/pub"

          # committer in background: ogni 20s pubblica progresso e risultati parziali
          (
            while true; do
              sleep 20
              cp -f progress.json "$PUB/progress.json" 2>/dev/null || true
              cp -f emails.csv "$PUB/emails.csv" 2>/dev/null || true
              ( cd "$PUB" && git add -A && git commit -q -m "progresso" >/dev/null 2>&1 \
                  && git push -q -f origin risultati >/dev/null 2>&1 ) || true
            done
          ) &
          COMMITTER=$!

          EXTRA=""
          if [ "${{ inputs.potenza }}" = "massima" ]; then
            EXTRA="--render --ocr"
          fi
          echo "Modalita': ${{ inputs.potenza }}  (opzioni: $EXTRA)"
          set +e
          python scraper.py \
            --input "${{ inputs.file_input }}" \
            --output emails.csv \
            --progress-file progress.json \
            --concurrency "${{ inputs.concurrency }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --timeout "${{ inputs.timeout }}" \
            $EXTRA
          RC=$?
          set -e

          # ferma il committer e pubblica il risultato finale
          kill $COMMITTER 2>/dev/null || true
          cp -f progress.json "$PUB/progress.json" 2>/dev/null || true
          cp -f emails.csv "$PUB/emails.csv" 2>/dev/null || true
          ( cd "$PUB" && git add -A && git commit -q -m "risultato finale" >/dev/null 2>&1 \
              && git push -q -f origin risultati >/dev/null 2>&1 ) || true
          exit $RC

      - name: Riepilogo risultati
        if: always()
        run: |
          if [ -f emails.csv ]; then
            TOTALE=$(($(wc -l < emails.csv) - 1))
            CON_EMAIL=$(awk -F',' 'NR>1 && $2!="" {print $1}' emails.csv | sort -u | wc -l)
            EMAIL_UNICHE=$(awk -F',' 'NR>1 && $2!="" {print $2}' emails.csv | sort -u | wc -l)
            echo "## Risultato scraping :mailbox:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Righe nel file: **$TOTALE**" >> $GITHUB_STEP_SUMMARY
            echo "- Siti con almeno un'email: **$CON_EMAIL**" >> $GITHUB_STEP_SUMMARY
            echo "- Email uniche trovate: **$EMAIL_UNICHE**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Scarica il file **emails.csv** qui sotto, nella sezione *Artifacts*." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Carica il risultato (emails.csv) come artifact da scaricare
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emails
          path: emails.csv
          if-no-files-found: warn
          retention-days: 90
