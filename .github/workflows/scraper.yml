name: Estrai email dai siti

# Si avvia a mano dalla scheda "Actions" del repo (pulsante "Run workflow")
# oppure dalla Dashboard. (riavvio con scraper corretto: fix backtracking)
on:
  workflow_dispatch:
    inputs:
      file_input:
        description: "Nome del file CSV con i siti (caricato nel repo)"
        required: true
        default: "siti.csv"
      potenza:
        description: "Potenza dello scraper"
        required: true
        type: choice
        default: "massima"
        options:
          - "massima"   # statico + render JavaScript + OCR immagini (piu' email, piu' lento)
          - "base"      # solo download statico (piu' veloce)
      concurrency:
        description: "Siti in parallelo (piu' alto = piu' veloce)"
        required: true
        default: "30"
      max_pages:
        description: "Pagine massime per sito (home + contatti)"
        required: true
        default: "8"
      timeout:
        description: "Timeout per pagina in secondi"
        required: true
        default: "15"
      riprendi:
        description: "Riprendere il giro precedente (si) o partire da zero (no)"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "si"

permissions:
  contents: write   # serve per pubblicare progresso e risultati sul branch "risultati"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"   # mostra l'avanzamento in tempo reale nel log

    steps:
      - name: Scarica il codice del repo
        uses: actions/checkout@v4

      - name: Imposta i parametri (con valori predefiniti)
        run: |
          echo "FILE=${{ inputs.file_input || 'siti.csv' }}" >> $GITHUB_ENV
          echo "POT=${{ inputs.potenza || 'massima' }}" >> $GITHUB_ENV
          echo "CONC=${{ inputs.concurrency || '30' }}" >> $GITHUB_ENV
          echo "PAGES=${{ inputs.max_pages || '8' }}" >> $GITHUB_ENV
          echo "TO=${{ inputs.timeout || '15' }}" >> $GITHUB_ENV

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze Python
        run: pip install -r requirements.txt

      - name: Installa il browser per il render JavaScript
        if: ${{ env.POT != 'base' }}
        run: python -m playwright install --with-deps chromium

      - name: Installa Tesseract per l'OCR (lettura email dalle immagini)
        if: ${{ false }}   # OCR disabilitato sui giri grandi (vedi step scraper)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ita

      - name: Controlla che il file dei siti esista
        run: |
          if [ ! -f "$FILE" ]; then
            echo "::error::Il file '$FILE' non esiste nel repo. Caricalo prima (Add file -> Upload files) e riprova."
            exit 1
          fi
          echo "Trovato il file: $FILE"

      - name: Prepara il branch "risultati" (per la dashboard)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # RIPRESA solo se richiesta esplicitamente (riprendi=si): riusa
          # l'emails.csv del giro precedente per saltare i siti gia' fatti.
          # Altrimenti si parte SEMPRE da zero (nessuna contaminazione tra liste).
          if [ "${{ inputs.riprendi }}" = "si" ] \
              && curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/risultati/emails.csv" -o emails.csv 2>/dev/null \
              && [ "$(wc -l < emails.csv)" -gt 1 ]; then
            echo "RIPRESA: trovate $(($(wc -l < emails.csv) - 1)) righe gia' presenti."
          else
            printf 'sito,email,stato\n' > emails.csv
            echo "Partenza da zero (lista pulita)."
          fi

          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB"
          cd "$PUB"
          git init -q
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan risultati
          cp -f "$GITHUB_WORKSPACE/emails.csv" emails.csv
          echo '{"running":true,"finished":false,"total":0,"done":0,"with_email":0,"emails":0}' > progress.json
          git add -A
          git commit -q -m "avvio"
          git push -q -f origin risultati

      - name: Esegui lo scraper (con pubblicazione live del progresso)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUB="$RUNNER_TEMP/pub"

          # committer in background: ogni 20s pubblica progresso e risultati parziali.
          # Ogni operazione git ha un timeout: un push lento NON deve mai
          # bloccare la pubblicazione del progresso.
          (
            while true; do
              sleep 20
              cp -f progress.json "$PUB/progress.json" 2>/dev/null || true
              cp -f emails.csv "$PUB/emails.csv" 2>/dev/null || true
              ( cd "$PUB" \
                  && timeout 25 git add -A >/dev/null 2>&1 \
                  && timeout 25 git commit -q -m "progresso" >/dev/null 2>&1 \
                  && timeout 40 git push -q -f origin risultati >/dev/null 2>&1 ) || true
            done
          ) &
          COMMITTER=$!

          EXTRA=""
          if [ "$POT" = "massima" ]; then
            # OCR disabilitato sui giri grandi: 0 email nel campione, alto rischio.
            EXTRA="--render"
          fi
          echo "Modalita': $POT  (opzioni: $EXTRA)"
          set +e
          python scraper.py \
            --input "$FILE" \
            --output emails.csv \
            --progress-file progress.json \
            --concurrency "$CONC" \
            --max-pages "$PAGES" \
            --timeout "$TO" \
            $EXTRA
          RC=$?
          set -e

          # ferma il committer e pubblica il risultato finale
          kill $COMMITTER 2>/dev/null || true
          cp -f progress.json "$PUB/progress.json" 2>/dev/null || true
          cp -f emails.csv "$PUB/emails.csv" 2>/dev/null || true
          ( cd "$PUB" \
              && timeout 25 git add -A >/dev/null 2>&1 \
              && timeout 25 git commit -q -m "risultato finale" >/dev/null 2>&1 \
              && timeout 60 git push -q -f origin risultati >/dev/null 2>&1 ) || true
          exit $RC

      - name: Riepilogo risultati
        if: always()
        run: |
          if [ -f emails.csv ]; then
            TOTALE=$(($(wc -l < emails.csv) - 1))
            CON_EMAIL=$(awk -F',' 'NR>1 && $2!="" {print $1}' emails.csv | sort -u | wc -l)
            EMAIL_UNICHE=$(awk -F',' 'NR>1 && $2!="" {print $2}' emails.csv | sort -u | wc -l)
            echo "## Risultato scraping :mailbox:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Righe nel file: **$TOTALE**" >> $GITHUB_STEP_SUMMARY
            echo "- Siti con almeno un'email: **$CON_EMAIL**" >> $GITHUB_STEP_SUMMARY
            echo "- Email uniche trovate: **$EMAIL_UNICHE**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Scarica il file **emails.csv** qui sotto, nella sezione *Artifacts*." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Carica il risultato (emails.csv) come artifact da scaricare
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emails
          path: emails.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Archivia il risultato nello storico
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # archivia il risultato di questo giro nel branch "storico"
          [ -f emails.csv ] || exit 0
          if [ "$(wc -l < emails.csv)" -le 1 ]; then exit 0; fi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          ARCH="$RUNNER_TEMP/arch"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --quiet --branch storico "$REMOTE" "$ARCH" 2>/dev/null; then
            :
          else
            mkdir -p "$ARCH"; cd "$ARCH"
            git init -q; git remote add origin "$REMOTE"
            git checkout -q --orphan storico
            echo '[]' > index.json
          fi
          cd "$ARCH"
          git config user.name "scraper-bot"
          git config user.email "scraper-bot@users.noreply.github.com"
          mkdir -p dati
          cp -f "$GITHUB_WORKSPACE/emails.csv" "dati/$STAMP.csv"
          python3 - "$STAMP" "${{ inputs.potenza || 'massima' }}" <<'PY'
          import json, sys, csv, os
          stamp, potenza = sys.argv[1], sys.argv[2]
          idx = []
          if os.path.exists("index.json"):
              try: idx = json.load(open("index.json"))
              except Exception: idx = []
          sites=set(); we=set(); em=0
          with open(f"dati/{stamp}.csv", encoding="utf-8", errors="replace") as f:
              r=csv.reader(f); next(r, None)
              for row in r:
                  if not row: continue
                  sites.add(row[0])
                  if len(row) > 1 and row[1].strip():
                      we.add(row[0]); em += 1
          idx = [e for e in idx if e.get("stamp") != stamp]
          idx.insert(0, {"stamp": stamp, "file": f"dati/{stamp}.csv",
                         "siti": len(sites), "con_email": len(we), "email": em,
                         "potenza": potenza})
          json.dump(idx, open("index.json", "w"), ensure_ascii=False, indent=1)
          PY
          timeout 30 git add -A
          timeout 30 git commit -q -m "storico $STAMP" || exit 0
          for i in 1 2 3; do
            timeout 60 git push -q origin storico && break
            timeout 30 git pull -q --no-rebase -X ours origin storico 2>/dev/null || true
            sleep 3
          done
